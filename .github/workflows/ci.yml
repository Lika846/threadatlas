# Minimal CI: typecheck, lint, unit and integration tests, and the Playwright e2e suite.
# Synthetic fixtures and temporary databases only. No secrets, no model download (the e2e
# suite uses a fake inference child) and no real-model tests (`npm run test:model` is opt-in).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Telemetry off for every tool run here (the npm scripts set these too).
  NEXT_TELEMETRY_DISABLED: "1"
  CHECKPOINT_DISABLE: "1"
  PRISMA_HIDE_UPDATE_MESSAGE: "1"
  # ThreadAtlas uses only ONNX Runtime's bundled CPU provider: on Linux x64 its install
  # script would otherwise download CUDA add-ons from NuGet.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  check:
    name: Typecheck, lint, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    name: End-to-end tests (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium and its system libraries
        run: npx playwright install --with-deps chromium
      # Builds the app and serves it on 127.0.0.1:3100 with a temporary database.
      - run: npm run test:e2e
      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
